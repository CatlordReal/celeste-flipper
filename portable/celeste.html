<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Celeste Classic Portable</title><style>:root{color-scheme:dark;--bg:#1e1e2e;--fg:#cdd6f4;--accent:#89b4fa;--panel:#313244}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif}main{width:min(100%,650px);padding:16px}header,.note{display:flex;align-items:center;gap:8px;flex-wrap:wrap}h1{font-size:18px;margin:0 auto 0 0}button,select{border:1px solid var(--accent);background:var(--panel);color:var(--fg);border-radius:6px;padding:7px 10px;font:inherit}canvas{display:block;width:512px;height:512px;max-width:100%;margin:14px auto 10px;image-rendering:pixelated;border:2px solid var(--accent);background:#000}.note{line-height:1.4}#status{min-height:20px;margin-top:8px}@media(max-width:540px){main{padding:10px}canvas{width:calc(100vw - 20px);height:calc(100vw - 20px)}}</style><main><header><h1>Celeste Classic Portable</h1><label>Theme <select id="theme"></select></label><label><input id="mono" type="checkbox"> 1-bit</label><button id="install">Install separate game</button><button id="close">Close session</button></header><canvas id="screen" width="128" height="128" aria-label="Flipper game screen"></canvas><div class="note">Arrows: move · Z / Space: jump · X / Shift: dash · Esc: pause. Progress saves on Flipper.</div><div id="status" role="status">Waiting for bridge</div></main><script>(()=>{'use strict';const W=128,H=128,N=8192,head=[67,76,83,84],pal=[[0,0,0],[29,43,83],[126,37,83],[0,135,81],[171,82,54],[95,87,79],[194,195,199],[255,241,232],[255,0,77],[255,163,0],[255,236,39],[0,228,54],[41,173,255],[131,118,156],[255,119,168],[255,204,170]],themes={Latte:['#eff1f5','#4c4f69','#1e66f5','#dce0e8'],Frappé:['#303446','#c6d0f5','#8caaee','#414559'],Macchiato:['#24273a','#cad3f5','#8aadf4','#363a4f'],Mocha:['#1e1e2e','#cdd6f4','#89b4fa','#313244'],Sand:['#f5eddd','#3d3429','#a86f22','#e6d5b4'],'Dawn Paper':['#fbf6ec','#4d4031','#af6f2f','#eee0c5'],'Golden Sand':['#f1d99d','#3f3116','#9d6614','#ddbf73'],'Golden Paper':['#fff1c9','#4b3715','#a66b14','#f0d896'],Sunset:['#422436','#fff0db','#f58b69','#5a3047'],Dusk:['#27233c','#e8e2ff','#ac9cff','#393152']},c=document.querySelector('#screen'),ctx=c.getContext('2d',{alpha:false}),status=document.querySelector('#status'),mono=document.querySelector('#mono'),theme=document.querySelector('#theme');Object.keys(themes).concat(['Light','Dark','System','Auto time']).forEach(x=>theme.add(new Option(x,x)));theme.value='Mocha';document.querySelector('#install').onclick=async()=>{status.textContent='Installing Windows game...';try{const r=await fetch('install',{method:'POST'});status.textContent=await r.text()}catch(e){status.textContent='Install failed'}};let mask=0,alive=true;const pressed=new Set();function pick(){let h=new Date().getHours(),v=theme.value;if(themes[v])return v;if(v==='Light')return'Latte';if(v==='Dark')return'Mocha';if(v==='System')return matchMedia('(prefers-color-scheme:light)').matches?'Latte':'Mocha';if(v==='Auto sunrise')return'Dawn Paper';if(v==='Auto golden hour')return'Golden Sand';if(v==='Auto sunset')return'Sunset';if(v==='Auto dusk')return'Dusk';return h<6?'Mocha':h<9?'Dawn Paper':h<16?'Latte':h<18?'Golden Sand':h<20?'Sunset':h<22?'Dusk':'Mocha'}function style(){let[a,b,d,e]=themes[pick()];document.documentElement.style.cssText=`--bg:${a};--fg:${b};--accent:${d};--panel:${e};color-scheme:${pick()==='Latte'?'light':'dark'}`}theme.onchange=style;setInterval(()=>{if(theme.value.startsWith('Auto'))style()},60000);style();function draw(p){let image=ctx.createImageData(W,H),o=0;for(let x of p)for(let i of[x&15,x>>4]){let[r,g,b]=pal[i],v=mono.checked&&(r*.2126+g*.7152+b*.0722<128)?0:mono.checked?255:null;image.data[o++]=v??r;image.data[o++]=v??g;image.data[o++]=v??b;image.data[o++]=255}ctx.putImageData(image,0,0)}async function post(path,body=''){try{await fetch(path,{method:'POST',headers:{'content-type':'text/plain'},body,keepalive:true})}catch(_){}}async function frame(){while(alive){try{let r=await fetch('frame',{cache:'no-store'});if(!r.ok)throw Error();let b=new Uint8Array(await r.arrayBuffer());if(b.length!==N+4||!head.every((v,i)=>b[i]===v))throw Error();draw(b.slice(4));status.textContent='Connected'}catch(_){status.textContent='Waiting for bridge';await new Promise(r=>setTimeout(r,500))}await new Promise(r=>setTimeout(r,100))}}const bits={ArrowLeft:1,ArrowRight:2,ArrowUp:4,ArrowDown:8,KeyZ:16,Space:16,KeyX:32,ShiftLeft:32,ShiftRight:32};addEventListener('keydown',e=>{if(e.code==='Escape'){if(!e.repeat)post('pause');e.preventDefault();return}let b=bits[e.code];if(b){pressed.add(e.code);mask=[...pressed].reduce((a,k)=>a|bits[k],0);post('keys',String(mask));e.preventDefault()}});addEventListener('keyup',e=>{let b=bits[e.code];if(b){pressed.delete(e.code);mask=[...pressed].reduce((a,k)=>a|bits[k],0);post('keys',String(mask));e.preventDefault()}});addEventListener('blur',()=>{pressed.clear();mask=0;post('keys','0')});setInterval(()=>post('keys',String(mask)),50);document.querySelector('#close').onclick=()=>{alive=false;pressed.clear();mask=0;post('keys','0');post('quit')};addEventListener('beforeunload',()=>{alive=false;pressed.clear();mask=0;post('keys','0')});frame()})();</script></html>
